name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  formula:
    name: style, audit, install
    runs-on: macos-latest
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the checkout as a real tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/nanohype/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          # cp -R, never `ln -s`. A symlinked tap resolves and audits without
          # error but silently skips audit's RuboCop cops: the same checkout
          # reports one finding as a symlink and two as a real directory. The
          # gate would pass for the wrong reason.
          cp -R "$GITHUB_WORKSPACE" "$tap_dir"

      - name: brew style
        run: brew style nanohype/tap

      - name: brew audit
        # Formulae are enumerated rather than named, so a formula added to the
        # tap is covered without editing CI.
        #
        # Enumerated rather than passed via `brew audit --tap`, too: Homebrew
        # skips an untrusted tap's formulae under --tap and exits 0 having
        # audited nothing. `brew tap-info nanohype/tap` reports "Untrusted", so
        # that form would report success while checking nothing.
        #
        # --except=version is a permanent, structural suppression rather than a
        # workaround for one formula. GoReleaser always emits `version` in the
        # formulae it generates (see the brews: block in
        # nanohype/cloudgov/.goreleaser.yaml), and audit calls that redundant
        # with the version scanned from the URL. It fails with no flags at all,
        # so every formula this tap will ever receive carries it.
        run: |
          set -euo pipefail
          ./script/tap-formulae.sh | xargs brew audit --online --except=version

      - name: brew audit --strict, allowing known generator findings
        # Blocking, not `continue-on-error`. A permanently-failing advisory step
        # renders "1 problem" and "3 problems" identically, so a second, real
        # finding would hide behind the expected one. The allowance is asserted
        # per formula instead: known findings pass, anything new fails, and a
        # clean run says so and asks to be simplified away.
        run: ./script/strict-audit.sh

      - name: brew install and brew test
        run: |
          set -euo pipefail
          ./script/tap-formulae.sh | while read -r formula; do
            brew install --formula "${formula}"
            brew test "${formula}"
          done

  checks:
    name: verify checksums and gate logic
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every declared sha256 against its published artifact
        # The install job only exercises the runner's own platform, which leaves
        # the other platforms' checksums unverified. This checks all of them,
        # for every formula in the tap.
        run: ./script/verify-artifact-checksums.sh

      - name: Test the audit-finding classifier
        # The classifier's whole job is noticing when audit output changes, and
        # it fails open if its allowance stops matching. Runs on synthetic
        # input: no Homebrew, no network.
        run: ./script/test-classify-audit-findings.sh
